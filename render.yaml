services:
  - type: web
    name: freellmapi
    runtime: docker
    plan: free  # or "starter" for better performance
    region: oregon  # choose the closest region to you
    dockerfilePath: ./Dockerfile.custom
    buildCommand: rm -rf node_modules package-lock.json && npm install && npm install -w server && npm run build -w client && npm run build -w server
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 3001
      - key: ENCRYPTION_KEY
        sync: false  # You'll set this manually in Render's dashboard
      - key: FREEAPI_DB_PATH
        value: /app/server/data/freeapi.db